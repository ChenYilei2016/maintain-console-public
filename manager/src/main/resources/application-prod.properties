spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.config.import=nacos:${spring.application.name}?refreshEnabled=true
spring.datasource.url=${datasource.url}
spring.datasource.username=${datasource.user.username}
spring.datasource.password=${datasource.user.password}
spring.cloud.nacos.discovery.username=nacos
spring.cloud.nacos.discovery.password=nacos
spring.cloud.nacos.discovery.server-addr=${remote.nacos.url}
spring.cloud.nacos.discovery.namespace=public
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
spring.flyway.locations=classpath:db/migration/mysql
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
maintain.manager.security.key-id=${MAINTAIN_SIGN_KEY_ID:default}
maintain.manager.security.private-key=${MAINTAIN_SIGN_PRIVATE_KEY:}
maintain.manager.security.allow-legacy-clients=${MAINTAIN_ALLOW_LEGACY_CLIENTS:false}
maintain.manager.security.legacy-private-key=${MAINTAIN_LEGACY_SIGN_PRIVATE_KEY:}
maintain.manager.security.identity-shared-secret=${MAINTAIN_IDENTITY_SHARED_SECRET:}
maintain.manager.security.allow-legacy-synchronous-execution=${MAINTAIN_ALLOW_LEGACY_SYNC_EXECUTION:false}
maintain.manager.target-environments[0].value=random
maintain.manager.target-environments[0].name=\u751f\u4ea7\u73af\u5883 \u00b7 \u5168\u90e8\u547d\u540d\u7a7a\u95f4
maintain.manager.target-environments[0].cluster=${MAINTAIN_TARGET_CLUSTER:default}
maintain.manager.target-environments[0].all-namespaces=true
maintain.manager.target-environments[0].production=true
