spring.datasource.url=${MAINTAIN_SQLITE_URL:jdbc:sqlite:manager/src/main/resources/sqlite/maintain-manager.sqlite}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.config.import-check.enabled=false
spring.flyway.locations=classpath:db/migration/sqlite
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
server.servlet.session.cookie.secure=false
maintain.manager.target-environments[0].value=random
maintain.manager.target-environments[0].name=全部命名空间
maintain.manager.target-environments[0].cluster=default
maintain.manager.target-environments[0].all-namespaces=true
maintain.manager.target-environments[0].production=false
maintain.manager.target-environments[1].value=prod
maintain.manager.target-environments[1].name=生产环境（SQLite 模拟）
maintain.manager.target-environments[1].cluster=local-prod-sqlite
maintain.manager.target-environments[1].all-namespaces=true
maintain.manager.target-environments[1].production=true
maintain.manager.target-environments[1].description=仅用于本地验证生产风险交互，仍调用本进程并使用 SQLite
