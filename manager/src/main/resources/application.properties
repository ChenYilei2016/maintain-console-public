spring.application.name=maintain-console
spring.profiles.default=local
# AI \u52A9\u624B\u9ED8\u8BA4\u5173\u95ED\uFF1B\u4EC5\u53D1\u9001\u811A\u672C\u3001Schema \u4E0E\u7528\u6237\u6307\u4EE4\uFF0C\u4E0D\u53D1\u9001\u8FD0\u884C\u53C2\u6570\u548C\u6267\u884C\u7ED3\u679C\u3002
maintain.manager.ai.enabled=${MAINTAIN_AI_ENABLED:true}
maintain.manager.ai.endpoint=${MAINTAIN_AI_ENDPOINT:}
maintain.manager.ai.api-key=${MAINTAIN_AI_API_KEY:}
maintain.manager.ai.model=${MAINTAIN_AI_MODEL:}
maintain.manager.ai.allow-insecure-endpoint=${MAINTAIN_AI_ALLOW_INSECURE_ENDPOINT:false}
# \u76EE\u6807\u73AF\u5883\u76EE\u5F55\u3002value \u4FDD\u7559\u65E7 API \u7684 env \u5B57\u6BB5\u8BED\u4E49\uFF0Cnamespace \u7528\u4E8E\u5339\u914D\u5BA2\u6237\u7AEF\u6CE8\u518C\u5143\u6570\u636E\u3002
maintain.manager.target-environments[0].value=random
maintain.manager.target-environments[0].name=\u5168\u90E8\u547D\u540D\u7A7A\u95F4
maintain.manager.target-environments[0].cluster=default
maintain.manager.target-environments[0].all-namespaces=true
maintain.manager.target-environments[0].production=false
server.port=9999
