# \u542F\u52A8\u793A\u4F8B\uFF1A
# java -jar manager/target/manager-1.0-SNAPSHOT.jar \
#   --spring.profiles.active=multi-nacos \
#   --spring.config.additional-location=optional:file:./demo/application-multi-nacos.properties
# MULTI_NACOS \u81EA\u5DF1\u7EF4\u62A4\u76EE\u6807\u6CE8\u518C\u4E2D\u5FC3\uFF0C\u5173\u95ED Spring Cloud \u7684\u9ED8\u8BA4\u53D1\u73B0/\u6CE8\u518C\uFF0C\u907F\u514D\u591A\u5EFA\u4E00\u6761\u65E0\u7528\u8FDE\u63A5\u3002
spring.cloud.nacos.discovery.enabled=false
spring.cloud.nacos.config.enabled=false
spring.cloud.nacos.config.import-check.enabled=false
spring.cloud.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
maintain.manager.discovery.mode=MULTI_NACOS
maintain.manager.discovery.max-services=500
# \u6D4B\u8BD5 Nacos\u3002namespace-id \u662F Nacos namespace ID\uFF0C\u4E0D\u662F\u5C55\u793A\u540D\u79F0\u3002
maintain.manager.discovery.nacos-connections[0].id=test-registry
maintain.manager.discovery.nacos-connections[0].name=\u6D4B\u8BD5\u6CE8\u518C\u4E2D\u5FC3
maintain.manager.discovery.nacos-connections[0].server-addr=${TEST_NACOS_ADDR:127.0.0.1:8848}
maintain.manager.discovery.nacos-connections[0].namespace-id=${TEST_NACOS_NAMESPACE_ID:public}
maintain.manager.discovery.nacos-connections[0].username=${TEST_NACOS_USERNAME:}
maintain.manager.discovery.nacos-connections[0].password=${TEST_NACOS_PASSWORD:}
maintain.manager.discovery.nacos-connections[0].default-group=${TEST_NACOS_GROUP:DEFAULT_GROUP}
maintain.manager.discovery.nacos-connections[0].secure=false
# \u751F\u4EA7 Nacos\u3002\u51ED\u8BC1\u4EC5\u4ECE\u73AF\u5883\u53D8\u91CF\u6CE8\u5165\uFF0C\u4E0D\u8981\u63D0\u4EA4\u771F\u5B9E\u8D26\u53F7\u5BC6\u7801\u3002
maintain.manager.discovery.nacos-connections[1].id=prod-registry
maintain.manager.discovery.nacos-connections[1].name=\u751F\u4EA7\u6CE8\u518C\u4E2D\u5FC3
maintain.manager.discovery.nacos-connections[1].server-addr=${PROD_NACOS_ADDR:127.0.0.1:8849}
maintain.manager.discovery.nacos-connections[1].namespace-id=${PROD_NACOS_NAMESPACE_ID:public}
maintain.manager.discovery.nacos-connections[1].username=${PROD_NACOS_USERNAME:}
maintain.manager.discovery.nacos-connections[1].password=${PROD_NACOS_PASSWORD:}
maintain.manager.discovery.nacos-connections[1].default-group=${PROD_NACOS_GROUP:DEFAULT_GROUP}
maintain.manager.discovery.nacos-connections[1].secure=false
# \u6BCF\u4E2A\u76EE\u6807\u73AF\u5883\u53EA\u80FD\u7ED1\u5B9A\u4E00\u4E2A\u6CE8\u518C\u4E2D\u5FC3\uFF1B\u8FDE\u63A5\u5931\u8D25\u65F6\u4E0D\u4F1A\u81EA\u52A8\u5207\u5230\u5176\u4ED6\u73AF\u5883\u3002
maintain.manager.target-environments[0].value=test
maintain.manager.target-environments[0].name=\u6D4B\u8BD5\u73AF\u5883
maintain.manager.target-environments[0].registry-id=test-registry
maintain.manager.target-environments[0].group-name=${TEST_NACOS_GROUP:DEFAULT_GROUP}
maintain.manager.target-environments[0].production=false
maintain.manager.target-environments[0].description=\u6D4B\u8BD5 Nacos \u4E2D\u7684\u670D\u52A1\u5B9E\u4F8B
maintain.manager.target-environments[1].value=prod
maintain.manager.target-environments[1].name=\u751F\u4EA7\u73AF\u5883
maintain.manager.target-environments[1].registry-id=prod-registry
maintain.manager.target-environments[1].group-name=${PROD_NACOS_GROUP:DEFAULT_GROUP}
maintain.manager.target-environments[1].instance-clusters[0]=${PROD_NACOS_CLUSTER:prod-cluster}
maintain.manager.target-environments[1].production=true
maintain.manager.target-environments[1].description=\u751F\u4EA7 Nacos \u4E2D\u7684\u670D\u52A1\u5B9E\u4F8B\uFF0C\u6267\u884C\u524D\u9700\u8981\u4E8C\u6B21\u786E\u8BA4
